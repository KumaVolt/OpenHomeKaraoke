# OpenHomeKaraoke for Portainer (Stacks → Add stack → Web editor), or any `docker compose up -d`.
# Uses the prebuilt image, so nothing is built on the server.
#
#   1. Change HOST_IP to the server's LAN IP.
#   2. Pick the image: add "-vocal" to the tag for the DNN vocal splitter (vocal removal and
#      vocals-only tracks; about 1-2 GB bigger and splitting is slow on a small CPU).
#   3. On a small Intel machine, turn on GPU encoding for the TV stream (see devices: below).
#   4. Deploy, then open http://<HOST_IP>:5000 on a phone and http://<HOST_IP>:4000 on the TV.

services:
  openhomekaraoke:
    # Branch builds are tagged with the branch name; add -vocal for the vocal splitter.
    # Once this is merged into master, :latest and :latest-vocal follow master.
    image: ghcr.io/kumavolt/openhomekaraoke:feature-synced-lyrics
    container_name: openhomekaraoke
    restart: unless-stopped
    environment:
      HOST_IP: "192.168.1.100"     # <-- change to the server's LAN IP
      # If you change the host side of a port below (e.g. "5050:5000"), also set:
      # PUBLIC_URL: "http://192.168.1.100:5050"
      SCREEN_SIZE: "1280x720"
      TZ: "Etc/UTC"
    # Extra app.py options, e.g. ["--admin-password", "secret", "-L", "zh_CN"]
    command: []
    ports:
      - "5000:5000"   # web UI
      - "5001:5001"   # web UI over https (needed for browser microphone / speech search)
      - "4000:4000"   # karaoke screen stream for the TV browser
    volumes:
      # A named volume works out of the box. To keep songs in a folder of your own instead, use e.g.
      # "/srv/karaoke/songs:/songs" and make that folder writable by uid 1000 (chown -R 1000:1000 ...).
      - songs:/songs
    shm_size: "256m"
    # Intel graphics (LattePanda, NUC, most Intel mini PCs): encode the TV stream on the GPU instead of the CPU.
    # Uncomment both, and set group_add to the group of the GPU device: run  stat -c %g /dev/dri/renderD128  on the server.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "993"

volumes:
  songs:
