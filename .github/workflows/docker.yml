# Builds the Docker image and publishes it to the GitHub Container Registry, so servers
# (Portainer, a NAS, a Raspberry Pi) can pull it instead of building it themselves.
#
# Two variants, each for amd64 and arm64:
#   ghcr.io/<owner>/openhomekaraoke:<tag>         light image
#   ghcr.io/<owner>/openhomekaraoke:<tag>-vocal   with the DNN vocal splitter (adds ~1-2 GB)
#
# <tag> is "latest" for master, the branch name for other branches (e.g. feature-synced-lyrics),
# or the version for tags like v1.2.0.
name: Docker image

on:
  push:
    branches: [master, 'feature/**']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [light, vocal]
        arch: [amd64, arm64]
    # native runners for each architecture: emulating arm64 makes the build many times slower
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openhomekaraoke" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: WITH_VOCAL_SPLITTER=${{ matrix.variant == 'vocal' }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}

      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.variant }}-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        variant: [light, vocal]
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openhomekaraoke" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.variant }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=${{ matrix.variant == 'vocal' && '-vocal' || '' }},onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref_name != 'master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Combine amd64 and arm64 into one tag
        run: |
          tags=$(jq -r '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digests=$(for f in /tmp/digests/*; do printf '%s@%s ' "$IMAGE" "$(cat "$f")"; done)
          docker buildx imagetools create $tags $digests
          for t in $(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do docker buildx imagetools inspect "$t"; done
